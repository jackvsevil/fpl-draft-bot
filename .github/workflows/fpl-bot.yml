name: FPL Draft bot

on:
  # Deadlines fall on Fridays, Saturdays, Sundays and Wednesdays at four
  # different times, so there is no single sensible schedule. Run hourly
  # and let the script decide whether there is anything to post.
  schedule:
    - cron: '5 * * * *'

  # Lets you run it by hand from the Actions tab.
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to post'
        required: true
        default: 'auto'
        type: choice
        options: [auto, preview, roundup]
      gw:
        description: 'Gameweek number (leave blank for automatic)'
        required: false
        type: string
      dry_run:
        description: 'Print the output instead of posting an issue'
        required: false
        default: false
        type: boolean
      force:
        description: 'Post again even if already posted for that gameweek'
        required: false
        default: false
        type: boolean

permissions:
  # contents: write is needed both for actions/checkout and to commit the
  # published archive back to the repo. Listing any permission here sets all
  # unlisted ones to none, so both must be spelled out.
  contents: write
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Run the bot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Optional. Without it the roundup still posts, just without the
          # closing banter section.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python fpl_bot.py \
            --mode "${{ inputs.mode || 'auto' }}" \
            ${{ inputs.gw && format('--gw {0}', inputs.gw) || '' }} \
            ${{ inputs.dry_run == true && '--dry-run' || '' }} \
            ${{ inputs.force == true && '--force' || '' }}

      - name: Publish the archive
        if: ${{ inputs.dry_run != true }}
        # continue-on-error: a failed push must never take down a run whose
        # post already went out as an issue.
        continue-on-error: true
        run: |
          if [ -z "$(git status --porcelain docs)" ]; then
            echo "Nothing new to publish."
            exit 0
          fi
          git config user.name  "fpl-draft-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Publish latest post"
          # Retry against a moving branch; another hourly run may have pushed.
          for i in 1 2 3; do
            if git push; then
              echo "Published."
              exit 0
            fi
            echo "Push failed (attempt $i). Rebasing and retrying..."
            git pull --rebase --autostash || true
            sleep 5
          done
          echo "::warning::Could not publish the archive after 3 attempts."
          echo "Check that the workflow has 'contents: write' permission."
          exit 1

  # unlisted ones to none, so both must be spelled out.
  contents: write
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Run the bot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Optional. Without it the roundup still posts, just without the
          # closing banter section.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python fpl_bot.py \
            --mode "${{ inputs.mode || 'auto' }}" \
            ${{ inputs.gw && format('--gw {0}', inputs.gw) || '' }} \
            ${{ inputs.dry_run == true && '--dry-run' || '' }} \
            ${{ inputs.force == true && '--force' || '' }}

      - name: Publish the archive
        if: ${{ inputs.dry_run != true }}
        run: |
          if [ -n "$(git status --porcelain docs)" ]; then
            git config user.name  "fpl-draft-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs
            git commit -m "Publish latest post"
            git push
          else
            echo "Nothing new to publish."
          fi
